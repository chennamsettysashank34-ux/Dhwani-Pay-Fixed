name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || '' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || '' }}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Run Verification Test Suite
      run: npm test

    - name: Generate Native Android Project (CNG)
      run: npx expo prebuild --platform android --clean

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      working-directory: android
      run: chmod +x gradlew

    - name: Build Standalone Release APK (With Embedded JS Bundle)
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dhwanipay-release-apk
        path: android/app/build/outputs/apk/release/*.apk
